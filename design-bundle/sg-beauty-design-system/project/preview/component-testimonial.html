<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #EED6C4; font-family: var(--font-body); }
  .frame { padding: 28px 28px; display: flex; gap: 22px; }
  .card { width: 360px; border-radius: 24px; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .read { background: rgba(23,49,62,0.3); }
  .read .quote { color: #FFF3E4; }
  .unread { background: #fff; }
  .unread .quote { color: #17313E; }
  .quote { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1.3; }
  .author { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: url(../assets/images/testimonial-avatar.jpg) center/cover; }
  .name { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 18px; color: #17313E; }
  .read .name { color: #fff; }
  .stars { display: flex; gap: 2px; color: #C9A86B; margin-top: 2px; }
  .stars svg { width: 12px; height: 12px; }
  .read .stars { color: #FFF3E4; }
</style>
