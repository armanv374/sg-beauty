<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Type Pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: var(--fg-1); }
  .frame { padding: 28px 32px; display: flex; flex-direction: column; gap: 8px; }
  .eyebrow { font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sg-sage-deep); }
  .display { font-family: "Playfair Display", Georgia, serif; font-size: 56px; font-weight: 600; color: var(--sg-ink); line-height: 1.05; letter-spacing: -0.01em; margin: 6px 0 10px; text-wrap: balance; }
  .body { font-family: var(--font-body); font-size: 17px; line-height: 1.55; color: var(--sg-rose-text); max-width: 560px; }
</style>
</head>
<body>
<div class="frame">
  <div class="eyebrow">Lash Extensions · Washington</div>
  <div class="display">Beautiful lashes,<br>made for everyday.</div>
  <div class="body">Playfair Display sets the tone — confident, editorial, a little romantic. Inter does the work underneath: legible at any size, calm at long lengths, and grounded against the serif.</div>
</div>
</body>
</html>
