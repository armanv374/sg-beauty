<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); color: var(--fg-1); }
  .frame { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sg-rose-text); width: 100px; font-weight: 600; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px; font-family: var(--font-body); font-size: 16px; font-weight: 700; line-height: 1; cursor: pointer; border: 1px solid transparent; transition: all 200ms cubic-bezier(.22,.61,.36,1); }
  .btn .arr { width: 14px; height: 14px; display: inline-flex; }
  .btn .arr svg { width: 100%; height: 100%; }
  .primary { background: #415E72; color: #fff; }
  .primary:hover { background: #6F7B61; }
  .secondary { background: transparent; color: #17313E; border-color: #17313E; }
  .ghost { background: transparent; color: #6F7B61; }
  .sage { background: #9CA68B; color: #fff; }
  .small { padding: 8px 16px; font-size: 14px; }
</style>
</head>
<body>
<div class="frame">
  <div class="row"><span class="label">Primary</span>
    <button class="btn primary">Book Now <span class="arr"><svg viewBox="0 0 6.391 11.095" fill="currentColor"><path d="M 6.147 4.948 C 6.303 5.104 6.391 5.316 6.391 5.537 C 6.391 5.758 6.303 5.97 6.147 6.126 L 1.433 10.841 C 1.276 10.998 1.065 11.082 0.847 11.08 C 0.628 11.078 0.419 10.99 0.265 10.836 C 0.11 10.681 0.022 10.472 0.021 10.254 C 0.019 10.035 0.103 9.825 0.254 9.668 L 4.379 5.537 L 0.254 1.412 C 0.103 1.255 0.019 1.045 0.021 0.826 C 0.022 0.608 0.11 0.399 0.265 0.244 C 0.419 0.09 0.628 0.002 0.847 0 C 1.065 -0.002 1.276 0.082 1.433 0.234 L 6.147 4.948 Z" fill-rule="evenodd"/></svg></span></button>
    <button class="btn sage">Book a set</button>
  </div>
  <div class="row"><span class="label">Secondary</span>
    <button class="btn secondary">View services <span class="arr"><svg viewBox="0 0 6.391 11.095" fill="currentColor"><path d="M 6.147 4.948 L 1.433 0.234 C 1.276 0.082 1.065 -0.002 0.847 0 C 0.628 0.002 0.419 0.09 0.265 0.244 C 0.11 0.399 0.022 0.608 0.021 0.826 C 0.019 1.045 0.103 1.255 0.254 1.412 L 4.379 5.537 L 0.254 9.668 C 0.103 9.825 0.019 10.035 0.021 10.254 C 0.022 10.472 0.11 10.681 0.265 10.836 C 0.419 10.99 0.628 11.078 0.847 11.08 C 1.065 11.082 1.276 10.998 1.433 10.841 L 6.147 6.126 C 6.303 5.97 6.391 5.758 6.391 5.537 C 6.391 5.316 6.303 5.104 6.147 4.948 Z" fill-rule="evenodd"/></svg></span></button>
    <button class="btn ghost">Learn more</button>
    <button class="btn primary small">Book now</button>
  </div>
</div>
</body>
</html>
