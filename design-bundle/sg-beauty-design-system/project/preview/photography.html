<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Photography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); }
  .frame { padding: 18px 22px; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
  .tile { aspect-ratio: 4/5; border-radius: 14px; overflow: hidden; position: relative; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .label { position: absolute; left: 10px; bottom: 8px; padding: 3px 8px; background: rgba(255,255,255,0.92); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #17313E; border-radius: 4px; }
  .tile.wide { aspect-ratio: 4/5; }
</style>
</head>
<body>
<div class="frame">
  <div class="tile wide"><img src="../assets/images/hero-portrait.png" alt=""><span class="label">Hero · soft natural light</span></div>
  <div class="tile"><img src="../assets/images/portrait-1.jpg" alt=""><span class="label">Editorial</span></div>
  <div class="tile"><img src="../assets/images/texture-shell.jpg" alt=""><span class="label">Texture divider</span></div>
</div>
</body>
</html>
