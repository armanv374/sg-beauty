<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Display Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FFF3E4; color: var(--fg-1); }
  .frame { padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
  .specimen { display: flex; align-items: baseline; gap: 16px; }
  .label { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sg-rose-text); min-width: 110px; flex-shrink: 0; }
  .text { font-family: var(--font-display); color: var(--sg-ink); line-height: 1; }
</style>
</head>
<body>
<div class="frame">
  <div class="specimen"><span class="label">H1 / 48px</span><span class="text" style="font-size:48px; font-weight:600; letter-spacing:-0.01em">Soft, precise lashes.</span></div>
  <div class="specimen"><span class="label">H2 / 32px</span><span class="text" style="font-size:32px; font-weight:600">Classic, hybrid, volume.</span></div>
  <div class="specimen"><span class="label">Quote / 28px</span><span class="text" style="font-size:28px; font-weight:600; font-style:italic">"The most natural set I've had."</span></div>
</div>
</body>
</html>
