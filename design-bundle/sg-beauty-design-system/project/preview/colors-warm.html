<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Warm Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); color: var(--fg-1); }
  .frame { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 84px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.06); position: relative; overflow: hidden; }
  .chip .hex { position: absolute; left: 10px; bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.85); color: #17313E; }
  .name { font-size: 12px; font-weight: 600; color: var(--sg-ink); letter-spacing: 0.02em; }
  .sub { font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="frame">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FFFFFF; border-color:rgba(0,0,0,0.12)"><span class="hex">#FFFFFF</span></div><div class="name">Paper</div><div class="sub">Page bg</div></div>
    <div class="sw"><div class="chip" style="background:#FFF3E4"><span class="hex">#FFF3E4</span></div><div class="name">Cream</div><div class="sub">Card surface</div></div>
    <div class="sw"><div class="chip" style="background:#EED6C4"><span class="hex">#EED6C4</span></div><div class="name">Blush</div><div class="sub">Section bg</div></div>
    <div class="sw"><div class="chip" style="background:#DCBFA8"><span class="hex">#DCBFA8</span></div><div class="name">Blush / Strong</div><div class="sub">Outline on cream</div></div>
    <div class="sw"><div class="chip" style="background:#6B4F4F; color:#fff"><span class="hex">#6B4F4F</span></div><div class="name">Rose Text</div><div class="sub">Muted body</div></div>
  </div>
</div>
</body>
</html>
