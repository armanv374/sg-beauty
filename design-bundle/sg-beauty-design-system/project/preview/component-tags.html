<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Tags & Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); color: #17313E; }
  .frame { padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sg-rose-text); font-weight: 600; width: 100px; }
  .pill { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .p-sage { background: #9CA68B; color: #fff; }
  .p-sage-soft { background: #E8ECDF; color: #4F5A45; }
  .p-cream { background: #FFF3E4; color: #17313E; border: 1px solid #EED6C4; }
  .p-slate { background: #17313E; color: #FFF3E4; }
  .p-coral { background: #FBE3E3; color: #D66363; }
  .chip { padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .c-new { background: #C9A86B; color: #fff; }
  .c-sale { background: #D66363; color: #fff; }
  .c-pop { background: #BCA0C7; color: #fff; }
</style>
</head>
<body>
<div class="frame">
  <div class="row"><span class="label">Filter pills</span><span class="pill p-sage">All</span><span class="pill p-cream">Classic</span><span class="pill p-cream">Hybrid</span><span class="pill p-cream">Volume</span><span class="pill p-cream">Lash lift</span></div>
  <div class="row"><span class="label">Tags</span><span class="pill p-sage-soft">$140 · 90 min</span><span class="pill p-slate">Most booked</span></div>
  <div class="row"><span class="label">Status chips</span><span class="chip c-new">New</span><span class="chip c-sale">15% off</span><span class="chip c-pop">Popular</span></div>
</div>
</body>
</html>
