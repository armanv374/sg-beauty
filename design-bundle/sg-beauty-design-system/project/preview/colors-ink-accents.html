<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Ink & Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); color: var(--fg-1); }
  .frame { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 84px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.06); position: relative; overflow: hidden; }
  .chip .hex { position: absolute; left: 10px; bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.92); color: #17313E; }
  .name { font-size: 12px; font-weight: 600; color: var(--sg-ink); letter-spacing: 0.02em; }
  .sub { font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="frame">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#17313E"><span class="hex">#17313E</span></div><div class="name">Ink</div><div class="sub">Body / heading text</div></div>
    <div class="sw"><div class="chip" style="background:#415E72"><span class="hex">#415E72</span></div><div class="name">Slate</div><div class="sub">Footer, contrast</div></div>
    <div class="sw"><div class="chip" style="background:#D8DDE1"><span class="hex">#D8DDE1</span></div><div class="name">Fog</div><div class="sub">Hero wash</div></div>
    <div class="sw"><div class="chip" style="background:#BCA0C7"><span class="hex">#BCA0C7</span></div><div class="name">Lilac</div><div class="sub">Icon halo accent</div></div>
    <div class="sw"><div class="chip" style="background:#D66363"><span class="hex">#D66363</span></div><div class="name">Coral</div><div class="sub">Error / sale</div></div>
  </div>
</div>
</body>
</html>
