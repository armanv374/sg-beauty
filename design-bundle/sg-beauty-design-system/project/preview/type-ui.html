<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — UI Type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: var(--fg-1); font-family: var(--font-body); }
  .frame { padding: 24px 32px; display: flex; flex-direction: column; gap: 14px; }
  .specimen { display: flex; align-items: baseline; gap: 16px; }
  .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sg-rose-text); min-width: 110px; flex-shrink: 0; font-weight: 600; }
</style>
</head>
<body>
<div class="frame">
  <div class="specimen"><span class="label">H3 / 24/600</span><span style="font-size:24px; font-weight:600; color: var(--sg-ink); line-height:1.3">Inter, used for section headings</span></div>
  <div class="specimen"><span class="label">H4 / 20/600</span><span style="font-size:20px; font-weight:600; color: var(--sg-ink)">Inter Semibold — card titles</span></div>
  <div class="specimen"><span class="label">Body LG / 18</span><span style="font-size:18px; font-weight:400; color: var(--sg-rose-text)">Inter Regular — lead paragraph copy</span></div>
  <div class="specimen"><span class="label">Body / 16</span><span style="font-size:16px; font-weight:400; color: var(--sg-rose-text); line-height:1.5">Inter Regular — paragraph body copy at sixteen pixels</span></div>
  <div class="specimen"><span class="label">Body SM / 14/300</span><span style="font-size:14px; font-weight:300; color: var(--sg-rose-text); line-height:1.5">Inter Light — captions, footnotes</span></div>
  <div class="specimen"><span class="label">Eyebrow / 12</span><span style="font-size:12px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color: var(--sg-sage-deep)">Book A Set</span></div>
</div>
</body>
</html>
