<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Brand Palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); color: var(--fg-1); }
  .frame { padding: 20px 24px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 84px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.06); position: relative; overflow: hidden; }
  .chip .hex { position: absolute; left: 10px; bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.85); color: #17313E; }
  .chip.dark .hex { background: rgba(255,255,255,0.92); }
  .name { font-size: 12px; font-weight: 600; color: var(--sg-ink); letter-spacing: 0.02em; }
  .sub { font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="frame">
  <div class="row">
    <div class="sw"><div class="chip" style="background:#9CA68B"><span class="hex">#9CA68B</span></div><div class="name">Sage</div><div class="sub">Primary brand</div></div>
    <div class="sw"><div class="chip dark" style="background:#6F7B61"><span class="hex">#6F7B61</span></div><div class="name">Sage / Deep</div><div class="sub">CTA hover</div></div>
    <div class="sw"><div class="chip dark" style="background:#4F5A45"><span class="hex">#4F5A45</span></div><div class="name">Sage / Darker</div><div class="sub">Pressed, focus</div></div>
    <div class="sw"><div class="chip" style="background:#C7CEB8"><span class="hex">#C7CEB8</span></div><div class="name">Sage / Soft</div><div class="sub">Dividers</div></div>
    <div class="sw"><div class="chip" style="background:#E8ECDF"><span class="hex">#E8ECDF</span></div><div class="name">Sage / Mist</div><div class="sub">Section wash</div></div>
  </div>
</div>
</body>
</html>
