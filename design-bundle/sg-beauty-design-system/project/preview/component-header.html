<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SG Beauty — Header</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); color: #17313E; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .brand { display: flex; align-items: center; }
  .brand img { height: 60px; width: auto; display: block; }
  .links { display: flex; gap: 28px; align-items: center; }
  .links a { font-size: 14px; font-weight: 500; color: #17313E; text-decoration: none; }
  .links a.active { color: #6F7B61; }
  .cta { padding: 10px 18px; border-radius: 999px; background: #17313E; color: #fff; font-size: 13px; font-weight: 700; border: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .nav.mist { background: #E8ECDF; box-shadow: none; }
</style>
</head>
<body>
<div class="nav">
  <div class="brand"><img src="../assets/logo-sg-beauty-transparent.png" alt="SG Beauty"></div>
  <div class="links">
    <a href="#" class="active">Services</a><a href="#">Gallery</a><a href="#">About</a><a href="#">Contact</a>
    <button class="cta">Book now →</button>
  </div>
</div>
<div class="nav mist" style="margin-top:8px">
  <div class="brand"><img src="../assets/logo-sg-beauty-transparent.png" alt="SG Beauty"></div>
  <div class="links">
    <a href="#" class="active">Services</a><a href="#">Gallery</a><a href="#">About</a><a href="#">Contact</a>
    <button class="cta">Book now →</button>
  </div>
</div>
</body>
</html>
